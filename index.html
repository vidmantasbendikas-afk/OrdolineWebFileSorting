<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ordoline — Dental Photo Sorting</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; color: #222; max-width: 960px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    h2 { font-size: 14px; margin: 0; font-weight: 600; }
    .muted { color: #777; }
    .hidden { display: none !important; }
    button { font: inherit; padding: 4px 12px; cursor: pointer; }
    #dropzone { border: 1px dashed #aaa; padding: 24px; text-align: center; margin: 16px 0 8px; cursor: pointer; }
    #dropzone.over { background: #f3f3f3; }
    #dropzone.disabled { opacity: .5; pointer-events: none; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
    /* fixed-size queue box: always present, scrolls when full, so nothing below it moves */
    #queue-grid { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; height: 96px; overflow-y: auto;
                  border: 1px solid #ddd; padding: 6px; box-sizing: border-box; }
    #queue-grid:empty::before { content: "No photos queued"; color: #999; font-size: 12px; }
    /* reserve the accuracy line's space even when empty */
    #overall-result { min-height: 1.5em; margin: 8px 0; }
    #overall-result.hidden { display: block !important; visibility: hidden; }
    .q-item { font-size: 12px; padding: 1px 6px; background: #f3f3f3; border-radius: 3px; }
    .q-item.error { background: #fdd; }
    .cat-card { border-top: 1px solid #ddd; padding: 8px 0; }
    .cat-head { display: flex; gap: 8px; align-items: baseline; }
    .cat-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .cat-grid:empty { display: none; }
    .chip { position: relative; width: 72px; height: 72px; }
    .chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .chip span { position: absolute; right: 0; bottom: 0; font-size: 10px; background: #000a; color: #fff; padding: 0 3px; }
    .chip.low { outline: 2px solid #e0a000; }
    .chip.mismatch { outline: 2px solid #d00; }
    .acc-good { color: #080; }
    .acc-bad { color: #c00; }
  </style>
</head>
<body>
  <h1>Ordoline — Dental Photo Sorting</h1>
  <div class="muted">Model: <span id="model-status">loading…</span> · runs locally in your browser</div>

  <div id="dropzone" tabindex="0" role="button">
    Drop photos here or <button id="open-btn" type="button">choose files</button>
    <input id="file-input" type="file" accept="image/*" multiple hidden />
  </div>

  <div id="queue">
    <div class="row"><span><span id="queue-count">0</span> photo(s) queued</span></div>
    <div id="queue-grid"></div>
  </div>

  <div class="row">
    <button id="submit-btn" type="button" disabled>Sort</button>
    <button id="stop-btn" type="button" disabled>Stop</button>
    <button id="clear-btn" type="button" disabled>Clear</button>
    <span id="sort-progress-text" class="muted"></span>
    <span style="flex:1"></span>
    <label class="muted" for="test-count">Test set</label>
    <select id="test-count">
      <option value="1">1 / class</option>
      <option value="3" selected>3 / class</option>
      <option value="10">10 / class</option>
      <option value="30">30 / class</option>
    </select>
    <button id="validate-btn" type="button" disabled>Run test set</button>
  </div>
  <p id="overall-result" class="hidden"></p>

  <div id="results"></div>

  <script type="module" src="dist/app/app.js"></script>
</body>
</html>
