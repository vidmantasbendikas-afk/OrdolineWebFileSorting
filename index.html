<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ordoline — Dental Photo Sorting</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230d9488' d='M12 2C8.5 2 6 4.3 6 8c0 2.4.8 4.4 1.4 6.6.5 1.9.6 7.4 2.3 7.4 1.6 0 .8-4.4 2.3-4.4s.7 4.4 2.3 4.4c1.7 0 1.8-5.5 2.3-7.4C17.2 12.4 18 10.4 18 8c0-3.7-2.5-6-6-6z'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C8.5 2 6 4.3 6 8c0 2.4.8 4.4 1.4 6.6.5 1.9.6 7.4 2.3 7.4 1.6 0 .8-4.4 2.3-4.4s.7 4.4 2.3 4.4c1.7 0 1.8-5.5 2.3-7.4C17.2 12.4 18 10.4 18 8c0-3.7-2.5-6-6-6z"/></svg>
        <div>
          <h1>Ordoline <span class="brand-sub">Dental Photo Sorting</span></h1>
        </div>
      </div>
      <div class="status">
        <span id="ep-badge" class="badge hidden"></span>
        <span id="model-status" class="badge badge-wait">Loading model…</span>
      </div>
    </div>
    <div id="model-progress" class="model-progress"><div id="model-progress-bar"></div></div>
  </header>

  <main>
    <section class="upload-card" aria-label="Upload photos">
      <div id="dropzone" class="dropzone" tabindex="0" role="button"
           aria-label="Upload photos: click to open file dialog or drag and drop photos here">
        <input id="file-input" type="file" accept="image/*" multiple hidden />
        <svg class="dz-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 21.9c-1.9 0-3.4-1.3-4-3.2l-.5-1.6c-.2-.7-.9-1.1-1.6-1.1H4.5A2.5 2.5 0 0 1 2 13.5v-9A2.5 2.5 0 0 1 4.5 2h15A2.5 2.5 0 0 1 22 4.5v9a2.5 2.5 0 0 1-2.5 2.5h-2.9c-.7 0-1.4.4-1.6 1.1l-.5 1.6c-.6 1.9-2.1 3.2-4 3.2z" opacity=".12"/><path fill="currentColor" d="M19.5 2h-15A3.5 3.5 0 0 0 1 5.5v9A3.5 3.5 0 0 0 4.5 18h2.9c.2 0 .4.1.4.3l.5 1.6c.8 2.5 2.8 4.1 5.2 4.1s4.4-1.6 5.2-4.1l.5-1.6c.1-.2.3-.3.4-.3h2.9A3.5 3.5 0 0 0 23 14.5v-9A3.5 3.5 0 0 0 19.5 2zm1.5 12.5c0 .8-.7 1.5-1.5 1.5h-2.9c-1.3 0-2.4.8-2.8 2l-.5 1.6c-.5 1.6-1.7 2.4-3.3 2.4s-2.8-.8-3.3-2.4l-.5-1.6c-.4-1.2-1.5-2-2.8-2H4.5c-.8 0-1.5-.7-1.5-1.5v-9C3 4.7 3.7 4 4.5 4h15c.8 0 1.5.7 1.5 1.5v9zM8.5 8.5c1 0 1.8-.8 1.8-1.8S9.5 5 8.5 5s-1.8.8-1.8 1.7.8 1.8 1.8 1.8zM21 15l-5.2-6.1c-.3-.4-.8-.6-1.3-.6s-1 .2-1.3.6l-3.1 3.7-1.2-1.2c-.3-.3-.7-.5-1.1-.5s-.8.2-1.1.5L3 15v.7c.4.2.9.3 1.5.3h15c.6 0 1.1-.1 1.5-.3z"/></svg>
        <p class="dz-title">Drop dental photos here</p>
        <p class="dz-hint">or</p>
        <button id="open-btn" class="btn btn-primary" type="button">Open</button>
        <p class="dz-note">JPG, PNG, WEBP — select as many as you like, then press Submit</p>
      </div>

      <div id="queue" class="queue hidden">
        <div class="queue-head">
          <h2>Ready to sort <span id="queue-count" class="count-pill">0</span></h2>
          <button id="clear-btn" class="btn btn-ghost" type="button">Clear</button>
        </div>
        <div id="queue-grid" class="queue-grid"></div>
      </div>

      <div class="submit-row">
        <button id="submit-btn" class="btn btn-primary btn-lg" type="button" disabled>Submit</button>
        <div id="sort-progress" class="sort-progress hidden">
          <div class="sort-progress-track"><div id="sort-progress-bar"></div></div>
          <span id="sort-progress-text">0 / 0</span>
        </div>
      </div>
      <p id="overall-result" class="overall-result hidden"></p>
    </section>

    <section id="results" class="results hidden" aria-label="Sorted categories"></section>
  </main>

  <footer>
    <div class="footer-inner">
      <span>All classification runs locally in your browser (WebGPU/WASM) — photos never leave this machine.</span>
      <span class="validate-row">
        <label for="test-count">Test set:</label>
        <select id="test-count">
          <option value="1">1 / class</option>
          <option value="3" selected>3 / class</option>
          <option value="10">10 / class</option>
          <option value="30">30 / class</option>
        </select>
        <button id="validate-btn" class="btn btn-ghost btn-sm" type="button" disabled>Load test images</button>
      </span>
    </div>
  </footer>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
    <img id="lightbox-img" alt="" />
    <p id="lightbox-caption"></p>
  </div>

  <script src="ort/ort.all.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
