<!DOCTYPE html>
<html><body><pre id="out">pending</pre>
<script type="module">
import { createSorter, OrdolineError, API_VERSION } from "./ordoline-sorter.js";
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.all.min.mjs";

const out = document.getElementById("out");
const lines = [];
const log = (s) => lines.push(s);
const TRUTH = {
  ceph_front: ["cephalometric_frontal"], ceph_side: ["cephalometric_lateral"],
  extr_profile: ["extraoral_profile_rest", "extraoral_profile_smile"],
  extr_rest: ["extraoral_frontal_rest"], extr_smile: ["extraoral_frontal_smile"],
  intr_front: ["intraoral_frontal"], intr_left: ["intraoral_left"], intr_right: ["intraoral_right"],
  intr_upper: ["intraoral_upper"], intr_lower: ["intraoral_lower"],
};

// Old (canvas) preprocessing from the original app, for comparison.
async function canvasPreprocess(blob, size) {
  const bmp = await createImageBitmap(blob, { imageOrientation: "from-image" });
  const scale = size / Math.max(bmp.width, bmp.height);
  const nw = Math.max(1, Math.round(bmp.width * scale)), nh = Math.max(1, Math.round(bmp.height * scale));
  const ctx = new OffscreenCanvas(size, size).getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, size, size);
  ctx.drawImage(bmp, Math.floor((size - nw) / 2), Math.floor((size - nh) / 2), nw, nh);
  const d = ctx.getImageData(0, 0, size, size).data, plane = size * size, o = new Float32Array(3 * plane);
  for (let i = 0; i < plane; i++) {
    o[i] = (d[4 * i] / 255 - 0.485) / 0.229; o[plane + i] = (d[4 * i + 1] / 255 - 0.456) / 0.224; o[2 * plane + i] = (d[4 * i + 2] / 255 - 0.406) / 0.225;
  }
  return o;
}
const CLS2CAT = { extr_rest: "extraoral_frontal_rest", extr_smile: "extraoral_frontal_smile", extr_profile_rest: "extraoral_profile_rest",
  extr_profile_smile: "extraoral_profile_smile", intr_front: "intraoral_frontal", intr_left: "intraoral_left", intr_right: "intraoral_right",
  intr_upper: "intraoral_upper", intr_lower: "intraoral_lower", ceph_front: "cephalometric_frontal", ceph_side: "cephalometric_lateral" };

try {
  const manifest = await (await fetch("../js/testfiles.json")).json();
  const files = Object.keys(manifest).sort().flatMap((d) => manifest[d].map((n) => ({ dir: d, url: `../data/test/${d}/${encodeURIComponent(n)}` })));
  const blobs = await Promise.all(files.map(async (f) => (await fetch(f.url)).blob()));

  // ---- 1. main thread, full test set via sort()
  const s = await createSorter({ executionProviders: ["wasm"] });
  log(`apiVersion=${API_VERSION} backend=${s.model.backend} inputSize=${s.model.inputSize}`);
  const res = await s.sort(blobs.map((b, i) => ({ image: b, id: `t${i}`, name: files[i].dir })));
  let correct = 0;
  const mainPred = res.results.map((r, i) => { if (r.ok && TRUTH[files[i].dir].includes(r.category)) correct++; return r.category; });
  log(`main thread (pure-JS preprocess): ${correct}/${files.length} = ${(100 * correct / files.length).toFixed(1)}%  ` +
      `failed=${res.summary.failed} lowConf=${res.summary.lowConfidence} avg=${Math.round(res.summary.timingMs / files.length)}ms/img`);
  log(`result keys: ${Object.keys(res.results[0]).join(",")}`);
  log(`JSON-serializable: ${JSON.stringify(res).length > 0}`);

  // ---- 2. old canvas preprocessing, same model, for comparison
  ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/";
  ort.env.wasm.numThreads = 1;
  const sess = await ort.InferenceSession.create(new Uint8Array(await (await fetch("model/best.onnx")).arrayBuffer()), { executionProviders: ["wasm"] });
  let oldCorrect = 0, agree = 0;
  for (let i = 0; i < files.length; i++) {
    const t = new ort.Tensor("float32", await canvasPreprocess(blobs[i], 384), [1, 3, 384, 384]);
    const p = (await sess.run({ [sess.inputNames[0]]: t }))[sess.outputNames[0]].data;
    let b = 0; for (let k = 1; k < p.length; k++) if (p[k] > p[b]) b = k;
    const cat = CLS2CAT[s.model.classes[b]];
    if (TRUTH[files[i].dir].includes(cat)) oldCorrect++;
    if (cat === mainPred[i]) agree++;
  }
  log(`old canvas preprocess:           ${oldCorrect}/${files.length} = ${(100 * oldCorrect / files.length).toFixed(1)}%   predictions agree with new: ${agree}/${files.length}`);
  await sess.release();

  // ---- 3. input types
  const b0 = blobs[0];
  const bmp = await createImageBitmap(b0, { imageOrientation: "from-image" });
  const ctx = new OffscreenCanvas(bmp.width, bmp.height).getContext("2d"); ctx.drawImage(bmp, 0, 0);
  const imgData = ctx.getImageData(0, 0, bmp.width, bmp.height);
  const img = new Image(); img.src = files[0].url;
  const types = {
    Blob: b0, File: new File([b0], "x.jpg", { type: "image/jpeg" }), ArrayBuffer: await b0.arrayBuffer(),
    Uint8Array: new Uint8Array(await b0.arrayBuffer()), "URL string": files[0].url, ImageBitmap: bmp, ImageData: imgData,
    "RawImage RGBA": { data: imgData.data, width: imgData.width, height: imgData.height },
    HTMLImageElement: img, wrapper: { image: b0, id: "custom-id", name: "custom-name" },
  };
  for (const [k, v] of Object.entries(types)) {
    const r = await s.classify(v);
    log(`input ${k.padEnd(16)} ok=${r.ok} ${r.ok ? r.category + " " + r.confidence.toFixed(3) : r.error.code} id=${r.id} name=${r.name}`);
  }
  // ---- 4. errors
  for (const [k, v] of Object.entries({ "garbage bytes": new Uint8Array([1, 2, 3]), "404 url": "../nope.jpg", number: 42 })) {
    const r = await s.classify(v);
    log(`error ${k.padEnd(14)} ok=${r.ok} code=${r.ok ? "-" : r.error.code}`);
  }
  const bad = await createSorter({ modelUrl: "../nope.onnx" }).catch((e) => e);
  log(`bad model: ${bad instanceof OrdolineError} code=${bad.code}`);

  // ---- 5. same core inside a Web Worker (no DOM)
  const worker = new Worker(new URL("./_selftest.worker.js", import.meta.url), { type: "module" });
  const wres = await new Promise((resolve) => { worker.onmessage = (e) => resolve(e.data); worker.postMessage(files.slice(0, 60).map((f) => f.url)); });
  if (wres.error) log(`worker: FAIL ${wres.error}`);
  else {
    const same = wres.categories.every((c, i) => c === mainPred[i]);
    log(`worker: noDocument=${wres.noDocument} backend=${wres.backend} ${wres.categories.length} images, identical to main thread: ${same}`);
  }
  out.textContent = "DONE\n" + lines.join("\n");
} catch (e) {
  out.textContent = "FAIL " + e + "\n" + e.stack + "\n" + lines.join("\n");
}
</script></body></html>
